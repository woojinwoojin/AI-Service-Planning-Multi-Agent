name: Cloud Run CD (main 자동 + 수동 트리거)

# **main 에 머지되면 배포 파이프라인이 자동으로 이어지는 승인형 CD.**
#
# 흐름: 게이트(ruff + pytest) → [승인 대기] → GCP 인증 → Cloud Run 새 Revision → 원격 /health.
# 게이트가 실패하면 배포 잡은 아예 시작하지 않는다(`needs`).
#
# ⚠️ **'자동'의 정확한 범위.** 트리거와 파이프라인 진행은 자동이지만, 실서비스에 반영되는
# 마지막 단계에는 사람 승인이 남아 있다 — `environment: production` 에 **Required reviewers**
# 가 걸려 있어서 배포 잡이 승인 대기로 멈춘다. 실 LLM 키가 붙은 공개 서비스라 이 게이트는
# 일부러 남겼다(main 이 움직일 때마다 비용·노출이 사람 확인 없이 바뀌지 않게).
# 완전 무인 배포로 바꾸려면 저장소 설정 → Environments → production 에서 Required reviewers
# 를 지워야 한다 — **코드 변경이 아니라 저장소 설정이다.**
# 그래서 발표·문서에서 "승인 없이 배포된다"고 말하면 틀린다. 또 `can_admins_bypass=true` 라
# "승인 없이는 절대 배포 불가"도 틀린다(관리자는 우회할 수 있다).
#
# 검증 이력: 2026-07-28 dispatch 로 전 경로 성공(WIF 인증 → Cloud Build → Revision
# ai-planning-agent-00003-7bs → 원격 /health ok). 그전까지 두 번 실패했고 둘 다 이 파일의
# 결함이었다 — `if: ${{ secrets.X }}`(steps.if 에서 secrets 를 못 본다) 와 ruff 미설치(exit 127).
# **이 워크플로는 PR CI 에서 돌지 않으므로 YAML 파싱만으로는 검증되지 않는다.**

on:
  # main 머지 → 자동 배포. 문서만 바뀐 커밋으로는 Cloud Build 를 돌리지 않는다
  # (이미지 동작이 같은데 Revision 과 빌드 비용만 늘어난다).
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'presentation-assets/**'
      - '.gitignore'
  # 되돌리기·재배포·더미 확인용 수동 경로는 남겨 둔다.
  workflow_dispatch:
    inputs:
      confirm:
        description: '실제 배포를 진행하려면 deploy 라고 입력'
        required: true
        default: ''
      dummy_mode:
        description: 'USE_DUMMY=1 로 올린다(키 없이 화면·계약만 확인할 때)'
        type: boolean
        default: false

# 같은 서비스에 두 배포가 겹치면 어느 Revision 이 살아남는지 예측할 수 없다.
# 진행 중인 배포를 취소하지 않고(cancel-in-progress: false) 뒤에 줄 세운다 — 배포를 중간에
# 끊으면 절반만 반영된 상태가 남을 수 있다.
concurrency:
  group: cloudrun-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # Workload Identity Federation(키 없는 GCP 인증)에 필요

env:
  GCP_REGION: asia-northeast3          # 서울. scripts/deploy_cloudrun.sh 기본값과 같게 유지
  CLOUD_RUN_SERVICE: ai-planning-agent

jobs:
  gate:
    name: 배포 게이트 (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `github.event_name` 조건이 **필수다.** push 트리거에는 `inputs` 가 없어
      # `inputs.confirm` 이 빈 값이 되고, 조건이 항상 참이 되어 **자동 배포가 전부
      # 이 단계에서 죽는다.** 오타 방지는 사람이 직접 누르는 경로에만 의미가 있다.
      - name: 오타 배포 방지 — confirm 입력 확인 (수동 트리거에만 적용)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm != 'deploy' }}
        run: |
          echo "::error title=확인 문자열 불일치::'deploy' 를 정확히 입력해야 진행한다(받은 값: '${{ inputs.confirm }}')."
          exit 1

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      # ruff 는 requirements.txt(런타임 의존성)에 없다 — 개발 도구를 배포 이미지에 넣지 않기
      # 위해서다. 그래서 게이트에서도 CI(ci.yml)와 **같은 버전을 명시해** 따로 설치한다.
      # (빼먹으면 `ruff: command not found`(exit 127) 로 게이트가 죽는다 — 실제 dispatch 가
      #  2026-07-27, 07-28 두 번 이 지점에서 실패했다.)
      # 버전을 올릴 땐 ci.yml 과 함께 올린다. 어긋나면 CI 는 통과하는데 배포만 막힌다.
      - run: |
          pip install -r requirements.txt
          pip install ruff==0.15.20

      # 검사 범위도 CI 와 같게 `.` 로 둔다. app/ tests/ 만 보면 scripts/ 의 lint 오류가
      # 게이트는 통과하고 CI 에서만 터진다(같은 코드에 두 기준이 생긴다).
      - name: Ruff
        run: ruff check .

      - name: pytest
        # 로컬 .env 에 의존하지 않도록 실행 구조를 명시한다(CI 와 같은 기준).
        env:
          WORKFLOW_MODE: serial
          USE_DUMMY: '1'
        run: pytest -q

  deploy:
    name: Cloud Run 배포 + /health 확인
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 저장소 설정 → Environments → production 에 Required reviewers 를 걸면 여기서 승인 대기한다.
    environment: production
    steps:
      - uses: actions/checkout@v5

      # 시크릿이 비었는지 확인은 `run:` 안에서 한다. **`if:` 에서는 secrets 를 볼 수 없다** —
      # GitHub 의 컨텍스트 가용성 표에 `steps[*].if` 용 컨텍스트로 `secrets` 가 없어서, 조건이
      # 의도대로 평가되지 않는다(처음 이 파일을 쓸 때 `if: ${{ secrets.X != '' }}` 로 인증 단계를
      # 갈랐는데, 그러면 **두 인증 단계가 모두 건너뛰어지고** 크레덴셜 없이 배포를 시도한다).
      # 시크릿을 조건으로 쓰려면 job 의 `env:` 로 옮겨 `env.X` 를 봐야 한다. 지금은 인증 방식을
      # 하나로 고정했으므로 조건 자체가 필요 없다.
      - name: 설정 확인 — 없는 값으로 배포를 시도하지 않는다
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
          WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for pair in "GCP_PROJECT:$PROJECT" "GCP_WORKLOAD_IDENTITY_PROVIDER:$WIF" "GCP_SERVICE_ACCOUNT:$SA"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then echo "::error title=시크릿 없음::$name"; missing=1; fi
          done
          [ "$missing" = "1" ] && { echo "설정 절차는 README '7-1 배포 절차' 참고."; exit 1; }
          echo "설정 확인 완료"

      # **인증은 Workload Identity Federation 하나만 지원한다.**
      # 서비스 계정 키(JSON) 폴백을 두지 않았다 — 장기 크리덴셜을 저장소에 두면 유출 시 회수가
      # 어렵고, 검증할 수 없는 분기를 늘리면 실패 지점만 는다.
      # WIF 단일 경로는 **2026-07-28 실제 dispatch 배포로 인증부터 원격 헬스체크까지 검증했다.**
      # 수동 배포가 필요하면 `scripts/deploy_cloudrun.sh` 경로가 있다(옵션을 이 파일과 같게 유지).
      - name: GCP 인증 (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Cloud Run 배포 (새 Revision)
        id: deploy
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
          # push(자동 배포) 에는 `inputs` 가 없어 이 식이 '0' = **실 모드**로 떨어진다. 의도한 값이다
          # — 자동 배포는 항상 실서비스 구성으로 올라간다.
          # ⚠️ `dummy_mode` 를 켜고 수동 배포하면 **공개 URL 이 더미로 덮인다**(2026-07-28 에 실제로
          # 그렇게 됐다). 더미로 확인한 뒤에는 실 모드로 되돌려야 한다 — main 에 아무 코드 커밋이
          # 머지되면 자동으로 되돌아가고, 급하면 `confirm=deploy` + dummy_mode 끄고 재-dispatch 한다.
          # 현재 모드는 `/health` 의 `dummy_mode` 필드로 확인한다(배포 성공 ≠ 실 모드).
          USE_DUMMY: ${{ inputs.dummy_mode && '1' || '0' }}
        run: |
          set -euo pipefail
          # `--source .` 는 Cloud Build 가 이미지를 만들어 준다(러너에 Docker 데몬 불필요).
          # `--max-instances=1` 은 필수다 — public_guard 의 요청·비용 카운터가 프로세스 메모리라,
          # 인스턴스가 늘면 상한이 인스턴스 수만큼 곱해진다(방어가 조용히 약해진다).
          # ⚠️ **`scripts/deploy_cloudrun.sh` 와 옵션·환경변수를 같게 유지한다.** 어긋나면 어느
          # 경로로 배포했는지에 따라 서비스 설정이 달라지고, 공개 상한이 '단일 프로세스·단일
          # 인스턴스' 전제 위에 서 있으므로 그 차이가 곧 방어 강도의 차이가 된다.
          # (외부 리뷰 P1: concurrency·min-instances 누락 + timeout 600/900 불일치)
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --project "$PROJECT" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --max-instances=1 \
            --min-instances=0 \
            --concurrency=8 \
            --cpu=1 --memory=1Gi --timeout=900 \
            --set-secrets="OPENAI_API_KEY=OPENAI_API_KEY:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest" \
            --set-env-vars="^@^USE_DUMMY=${USE_DUMMY}@LLM_PROVIDER=openai@OPENAI_MODEL=gpt-4o-mini@WORKFLOW_MODE=parallel@ENABLE_DEMO_TOOLS=0@ENABLE_SERVER_SAVE=0@ARTIFACT_READ_MODE=legacy@PUBLIC_MAX_RUNS_PER_IP=5@PUBLIC_IP_WINDOW_SEC=3600@PUBLIC_MAX_RUNS_PER_DAY=100@PUBLIC_MAX_COST_PER_DAY_USD=2.0@PUBLIC_MAX_SUGGESTIONS_PER_IP=20"

          url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT" --region "$GCP_REGION" --format='value(status.url)')"
          rev="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT" --region "$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          echo "url=$url"      >> "$GITHUB_OUTPUT"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: 원격 /health 확인
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -uo pipefail
          for i in $(seq 1 20); do
            body="$(curl -fsS --max-time 10 "$URL/health" || true)"
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "healthy after ${i} tries"
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=배포 후 health 실패::$URL/health 가 200/ok 를 주지 않았다. Revision 로그를 확인하고 필요하면 이전 Revision 으로 트래픽을 되돌린다."
          exit 1

      - name: 배포 기록 요약 (Actions 요약에 남긴다)
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
          REV: ${{ steps.deploy.outputs.revision }}
          # 요약에는 **실제로 넘긴 값**을 적는다. `inputs.dummy_mode` 를 그대로 쓰면 push 배포에서
          # 빈 칸으로 나와, 실 모드로 올라간 것을 알 수 없다.
          USE_DUMMY: ${{ inputs.dummy_mode && '1' || '0' }}
        run: |
          {
            echo "## Cloud Run 배포"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 서비스 | \`$CLOUD_RUN_SERVICE\` (${GCP_REGION}) |"
            echo "| Revision | \`${REV:-생성 안 됨}\` |"
            echo "| URL | ${URL:-없음} |"
            echo "| Git commit | \`${GITHUB_SHA}\` |"
            echo "| 트리거 | ${GITHUB_EVENT_NAME} |"
            if [ "$USE_DUMMY" = "1" ]; then
              echo "| 실행 모드 | ⚠️ **더미**(USE_DUMMY=1) — 공개 URL 이 더미로 덮였다. 실 모드로 되돌릴 것 |"
            else
              echo "| 실행 모드 | 실 LLM (USE_DUMMY=0) |"
            fi
            echo ""
            echo "Revision ↔ commit 대응을 남기는 이유: 배포된 것이 어느 소스인지 나중에 확인해야 한다."
            echo "실제 반영 여부는 \`/health\` 의 \`dummy_mode\` 로 확인한다 — 배포 성공 ≠ 실 모드."
          } >> "$GITHUB_STEP_SUMMARY"
