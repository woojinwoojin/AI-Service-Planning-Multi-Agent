name: Cloud Run 배포 (승인형)

# **사람이 버튼을 눌러야만 도는 승인형 CD.** push 트리거를 일부러 두지 않았다 —
# 실 LLM 키가 붙은 공개 서비스라, main 이 움직일 때마다 자동 배포되면 비용·노출이
# 사람의 확인 없이 바뀐다.
#
# 흐름: 게이트(ruff + pytest) → GCP 인증 → Cloud Run 새 Revision → 원격 /health 확인.
# 게이트가 실패하면 배포 잡은 아예 시작하지 않는다(`needs`).
#
# **GitHub Environment `production` 을 쓴다.** 저장소 설정에서 그 환경에 Required reviewers 를
# 걸면 이 잡이 승인 대기로 멈춘다 — 워크플로 파일만으로는 승인을 강제할 수 없으므로,
# 진짜 '승인형'으로 만들려면 그 설정이 필요하다(README 배포 절차에 적어 뒀다).
#
# ⚠️ 이 워크플로는 **아직 실제로 실행해 검증하지 않았다.** 시크릿·WIF 설정은 저장소 관리자만
# 할 수 있고, 그 전에는 인증 단계에서 명확한 메시지와 함께 실패한다(가짜 성공을 만들지 않는다).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '실제 배포를 진행하려면 deploy 라고 입력'
        required: true
        default: ''
      dummy_mode:
        description: 'USE_DUMMY=1 로 올린다(키 없이 화면·계약만 확인할 때)'
        type: boolean
        default: false

# 같은 서비스에 두 배포가 겹치면 어느 Revision 이 살아남는지 예측할 수 없다.
# 진행 중인 배포를 취소하지 않고(cancel-in-progress: false) 뒤에 줄 세운다 — 배포를 중간에
# 끊으면 절반만 반영된 상태가 남을 수 있다.
concurrency:
  group: cloudrun-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # Workload Identity Federation(키 없는 GCP 인증)에 필요

env:
  GCP_REGION: asia-northeast3          # 서울. scripts/deploy_cloudrun.sh 기본값과 같게 유지
  CLOUD_RUN_SERVICE: ai-planning-agent

jobs:
  gate:
    name: 배포 게이트 (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 오타 배포 방지 — confirm 입력 확인
        if: ${{ inputs.confirm != 'deploy' }}
        run: |
          echo "::error title=확인 문자열 불일치::'deploy' 를 정확히 입력해야 진행한다(받은 값: '${{ inputs.confirm }}')."
          exit 1

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check app/ tests/

      - name: pytest
        # 로컬 .env 에 의존하지 않도록 실행 구조를 명시한다(CI 와 같은 기준).
        env:
          WORKFLOW_MODE: serial
          USE_DUMMY: '1'
        run: pytest -q

  deploy:
    name: Cloud Run 배포 + /health 확인
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 저장소 설정 → Environments → production 에 Required reviewers 를 걸면 여기서 승인 대기한다.
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: 설정 확인 — 없는 값으로 배포를 시도하지 않는다
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
          WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          missing=0
          if [ -z "$PROJECT" ]; then echo "::error title=시크릿 없음::GCP_PROJECT"; missing=1; fi
          # 인증은 WIF(권장) 또는 서비스 계정 키 중 하나면 된다.
          if [ -z "$WIF$KEY" ]; then
            echo "::error title=인증 미설정::GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT(권장) 또는 GCP_SA_KEY 가 필요하다."
            missing=1
          fi
          if [ -n "$WIF" ] && [ -z "$SA" ]; then
            echo "::error title=인증 불완전::WIF 를 쓰면 GCP_SERVICE_ACCOUNT 도 필요하다."
            missing=1
          fi
          [ "$missing" = "1" ] && { echo "설정 절차는 README '배포 절차' 참고."; exit 1; }
          echo "설정 확인 완료"

      # 키 없는 인증(권장) — 장기 크리덴셜을 저장소에 두지 않는다.
      - name: GCP 인증 (Workload Identity Federation)
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 폴백 — WIF 를 아직 설정하지 못한 경우. 키가 유출되면 회수가 어려우니 WIF 를 권한다.
      - name: GCP 인증 (서비스 계정 키 — 폴백)
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER == '' && secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Cloud Run 배포 (새 Revision)
        id: deploy
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
          USE_DUMMY: ${{ inputs.dummy_mode && '1' || '0' }}
        run: |
          set -euo pipefail
          # `--source .` 는 Cloud Build 가 이미지를 만들어 준다(러너에 Docker 데몬 불필요).
          # `--max-instances=1` 은 필수다 — public_guard 의 요청·비용 카운터가 프로세스 메모리라,
          # 인스턴스가 늘면 상한이 인스턴스 수만큼 곱해진다(방어가 조용히 약해진다).
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --project "$PROJECT" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --max-instances=1 \
            --cpu=1 --memory=1Gi --timeout=900 \
            --set-secrets="OPENAI_API_KEY=OPENAI_API_KEY:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest" \
            --set-env-vars="^@^USE_DUMMY=${USE_DUMMY}@LLM_PROVIDER=openai@OPENAI_MODEL=gpt-4o-mini@WORKFLOW_MODE=parallel@ENABLE_DEMO_TOOLS=0@ARTIFACT_READ_MODE=legacy@PUBLIC_MAX_RUNS_PER_IP=5@PUBLIC_IP_WINDOW_SEC=3600@PUBLIC_MAX_RUNS_PER_DAY=100@PUBLIC_MAX_COST_PER_DAY_USD=2.0"

          url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT" --region "$GCP_REGION" --format='value(status.url)')"
          rev="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT" --region "$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          echo "url=$url"      >> "$GITHUB_OUTPUT"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: 원격 /health 확인
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -uo pipefail
          for i in $(seq 1 20); do
            body="$(curl -fsS --max-time 10 "$URL/health" || true)"
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "healthy after ${i} tries"
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=배포 후 health 실패::$URL/health 가 200/ok 를 주지 않았다. Revision 로그를 확인하고 필요하면 이전 Revision 으로 트래픽을 되돌린다."
          exit 1

      - name: 배포 기록 요약 (Actions 요약에 남긴다)
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
          REV: ${{ steps.deploy.outputs.revision }}
        run: |
          {
            echo "## Cloud Run 배포"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 서비스 | \`$CLOUD_RUN_SERVICE\` (${GCP_REGION}) |"
            echo "| Revision | \`${REV:-생성 안 됨}\` |"
            echo "| URL | ${URL:-없음} |"
            echo "| Git commit | \`${GITHUB_SHA}\` |"
            echo "| 더미 모드 | ${{ inputs.dummy_mode }} |"
            echo ""
            echo "Revision ↔ commit 대응을 남기는 이유: 배포된 것이 어느 소스인지 나중에 확인해야 한다."
          } >> "$GITHUB_STEP_SUMMARY"
