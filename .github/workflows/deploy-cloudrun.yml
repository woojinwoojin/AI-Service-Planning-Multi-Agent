name: Cloud Run 배포 (수동 트리거)

# **사람이 버튼을 눌러야만 도는 수동 트리거 배포.** push 트리거를 일부러 두지 않았다 —
# 실 LLM 키가 붙은 공개 서비스라, main 이 움직일 때마다 자동 배포되면 비용·노출이
# 사람의 확인 없이 바뀐다.
#
# 흐름: 게이트(ruff + pytest) → GCP 인증 → Cloud Run 새 Revision → 원격 /health 확인.
# 게이트가 실패하면 배포 잡은 아예 시작하지 않는다(`needs`).
#
# ⚠️ **이름을 '승인형'이라고 하지 않은 이유.** `environment: production` 을 선언하는 것만으로는
# 승인 절차가 생기지 않는다. 저장소 설정 → Environments → production 에 **Required reviewers**
# 보호 규칙을 걸어야 그 잡이 승인 대기로 멈춘다. 그래서 단계별 정확한 명칭은 이렇다:
#
#   지금                        : 수동 트리거형 Cloud Run 배포 워크플로
#   Required reviewers 설정 후  : 승인형 Cloud Run CD
#   실제 dispatch 성공 후       : 검증된 승인형 Cloud Run CD
#
# (비공개 저장소는 요금제에 따라 Required reviewers 를 못 쓸 수 있으니 플랜도 확인해야 한다.)
#
# ⚠️ 이 워크플로는 **아직 실제로 실행해 검증하지 않았다.** 시크릿·WIF 설정은 저장소 관리자만
# 할 수 있고, 그 전에는 설정 확인 단계에서 명확한 메시지와 함께 실패한다(가짜 성공을 만들지 않는다).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '실제 배포를 진행하려면 deploy 라고 입력'
        required: true
        default: ''
      dummy_mode:
        description: 'USE_DUMMY=1 로 올린다(키 없이 화면·계약만 확인할 때)'
        type: boolean
        default: false

# 같은 서비스에 두 배포가 겹치면 어느 Revision 이 살아남는지 예측할 수 없다.
# 진행 중인 배포를 취소하지 않고(cancel-in-progress: false) 뒤에 줄 세운다 — 배포를 중간에
# 끊으면 절반만 반영된 상태가 남을 수 있다.
concurrency:
  group: cloudrun-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # Workload Identity Federation(키 없는 GCP 인증)에 필요

env:
  GCP_REGION: asia-northeast3          # 서울. scripts/deploy_cloudrun.sh 기본값과 같게 유지
  CLOUD_RUN_SERVICE: ai-planning-agent

jobs:
  gate:
    name: 배포 게이트 (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 오타 배포 방지 — confirm 입력 확인
        if: ${{ inputs.confirm != 'deploy' }}
        run: |
          echo "::error title=확인 문자열 불일치::'deploy' 를 정확히 입력해야 진행한다(받은 값: '${{ inputs.confirm }}')."
          exit 1

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check app/ tests/

      - name: pytest
        # 로컬 .env 에 의존하지 않도록 실행 구조를 명시한다(CI 와 같은 기준).
        env:
          WORKFLOW_MODE: serial
          USE_DUMMY: '1'
        run: pytest -q

  deploy:
    name: Cloud Run 배포 + /health 확인
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 저장소 설정 → Environments → production 에 Required reviewers 를 걸면 여기서 승인 대기한다.
    environment: production
    steps:
      - uses: actions/checkout@v5

      # 시크릿이 비었는지 확인은 `run:` 안에서 한다. **`if:` 에서는 secrets 를 볼 수 없다** —
      # GitHub 의 컨텍스트 가용성 표에 `steps[*].if` 용 컨텍스트로 `secrets` 가 없어서, 조건이
      # 의도대로 평가되지 않는다(처음 이 파일을 쓸 때 `if: ${{ secrets.X != '' }}` 로 인증 단계를
      # 갈랐는데, 그러면 **두 인증 단계가 모두 건너뛰어지고** 크레덴셜 없이 배포를 시도한다).
      # 시크릿을 조건으로 쓰려면 job 의 `env:` 로 옮겨 `env.X` 를 봐야 한다. 지금은 인증 방식을
      # 하나로 고정했으므로 조건 자체가 필요 없다.
      - name: 설정 확인 — 없는 값으로 배포를 시도하지 않는다
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
          WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for pair in "GCP_PROJECT:$PROJECT" "GCP_WORKLOAD_IDENTITY_PROVIDER:$WIF" "GCP_SERVICE_ACCOUNT:$SA"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then echo "::error title=시크릿 없음::$name"; missing=1; fi
          done
          [ "$missing" = "1" ] && { echo "설정 절차는 README '7-1 배포 절차' 참고."; exit 1; }
          echo "설정 확인 완료"

      # **인증은 Workload Identity Federation 하나만 지원한다.**
      # 서비스 계정 키(JSON) 폴백을 두지 않은 이유는 두 가지다:
      #   1) 장기 크리덴셜을 저장소에 두면 유출 시 회수가 어렵다.
      #   2) 검증할 수 없는 분기를 늘리지 않는다 — 이 워크플로 자체가 아직 실행 검증 전이고,
      #      두 경로 중 어느 쪽도 돌려보지 못한 상태에서 갈래를 두면 실패 지점만 늘어난다.
      # 수동 배포가 필요하면 이미 검증된 `scripts/deploy_cloudrun.sh` 경로가 있다.
      - name: GCP 인증 (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Cloud Run 배포 (새 Revision)
        id: deploy
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
          USE_DUMMY: ${{ inputs.dummy_mode && '1' || '0' }}
        run: |
          set -euo pipefail
          # `--source .` 는 Cloud Build 가 이미지를 만들어 준다(러너에 Docker 데몬 불필요).
          # `--max-instances=1` 은 필수다 — public_guard 의 요청·비용 카운터가 프로세스 메모리라,
          # 인스턴스가 늘면 상한이 인스턴스 수만큼 곱해진다(방어가 조용히 약해진다).
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --project "$PROJECT" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --max-instances=1 \
            --cpu=1 --memory=1Gi --timeout=900 \
            --set-secrets="OPENAI_API_KEY=OPENAI_API_KEY:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest" \
            --set-env-vars="^@^USE_DUMMY=${USE_DUMMY}@LLM_PROVIDER=openai@OPENAI_MODEL=gpt-4o-mini@WORKFLOW_MODE=parallel@ENABLE_DEMO_TOOLS=0@ARTIFACT_READ_MODE=legacy@PUBLIC_MAX_RUNS_PER_IP=5@PUBLIC_IP_WINDOW_SEC=3600@PUBLIC_MAX_RUNS_PER_DAY=100@PUBLIC_MAX_COST_PER_DAY_USD=2.0"

          url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT" --region "$GCP_REGION" --format='value(status.url)')"
          rev="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT" --region "$GCP_REGION" --format='value(status.latestReadyRevisionName)')"
          echo "url=$url"      >> "$GITHUB_OUTPUT"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      - name: 원격 /health 확인
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -uo pipefail
          for i in $(seq 1 20); do
            body="$(curl -fsS --max-time 10 "$URL/health" || true)"
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "healthy after ${i} tries"
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=배포 후 health 실패::$URL/health 가 200/ok 를 주지 않았다. Revision 로그를 확인하고 필요하면 이전 Revision 으로 트래픽을 되돌린다."
          exit 1

      - name: 배포 기록 요약 (Actions 요약에 남긴다)
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
          REV: ${{ steps.deploy.outputs.revision }}
        run: |
          {
            echo "## Cloud Run 배포"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 서비스 | \`$CLOUD_RUN_SERVICE\` (${GCP_REGION}) |"
            echo "| Revision | \`${REV:-생성 안 됨}\` |"
            echo "| URL | ${URL:-없음} |"
            echo "| Git commit | \`${GITHUB_SHA}\` |"
            echo "| 더미 모드 | ${{ inputs.dummy_mode }} |"
            echo ""
            echo "Revision ↔ commit 대응을 남기는 이유: 배포된 것이 어느 소스인지 나중에 확인해야 한다."
          } >> "$GITHUB_STEP_SUMMARY"
